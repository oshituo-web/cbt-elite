<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBT Practice - Elite Learning Platform</title>
    <meta name="description" content="The ultimate CBT practice platform for JAMB, WAEC, and NECO. Thousands of AI-generated questions, instant results, and detailed performance analytics." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4db6ac">
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <!-- Phase 2: KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>

    <!-- Phase 3: PapaParse for CSV Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Phase 13: Lucide Icons CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </head>
  <body>
    <div id="app" class="elite-layout">
      <!-- \uD83D\uDED2 Phase 12: Consolidated Branding & System Top Bar -->
      <header id="app-header" class="glass branding-header">
        <div class="header-content container-fluid">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <button id="sidebar-toggle" class="header-icon-btn" title="Toggle Sidebar">
              <i data-lucide="menu"></i>
            </button>
            <div class="branding-logo" style="display: flex; align-items: center; gap: 0.5rem;">
              <span class="logo-icon" style="display: flex; color: var(--accent-primary);"><i data-lucide="graduation-cap"></i></span> 
              <span class="logo-text" style="font-size: 1.8rem; font-weight: 900; letter-spacing: -0.02em;">CBT<span class="accent">Elite</span></span>
            </div>
          </div>

          <div class="header-center">
            <!-- Global Stats Integrated into Top Bar -->
            <div id="global-stats-bar" style="display: flex; align-items: center; gap: 1rem;">
              <div id="header-streak" class="streak-mini" title="Your Streak" style="display: flex; align-items: center; gap: 0.35rem;">
                <i data-lucide="flame" style="width: 16px; height: 16px;"></i> <span id="streak-text">0</span>
              </div>
              <div id="header-tier" class="tier-mini" title="Your Account Tier" style="display: flex; align-items: center; gap: 0.35rem;">
                <i data-lucide="award" style="width: 16px; height: 16px;"></i> <span id="tier-text">FREE</span>
              </div>
            </div>
          </div>

          <div class="header-actions">
            <button id="global-news-btn" class="header-icon-btn" title="Exam News & Updates" style="position: relative;">
               <i data-lucide="bell"></i>
               <span id="notification-badge" class="notification-count">0</span>
            </button>
            <button id="global-help-btn" class="header-icon-btn" title="Help Guide"><i data-lucide="help-circle"></i></button>
            <button id="global-theme-toggle" class="header-icon-btn" title="Toggle Theme"><i data-lucide="sun"></i></button>
            <div style="width: 1px; height: 24px; background: var(--glass-border); margin: 0 0.5rem;"></div>
            <div id="profile-trigger" class="user-profile-badge" title="Your Profile">
              <div class="profile-avatar" id="header-avatar" style="display: none;"></div>
              <i data-lucide="user-circle" style="color: var(--accent-primary); width: 32px; height: 32px;"></i>
              <span class="profile-name mobile-hide" id="header-username">Student</span>
            </div>
          </div>
        </div>
      </header>

      <!-- \uD83D\uDDFD Phase 12: Collapsible Side Navigation (Default: Collapsed) -->
      <aside id="app-sidebar" class="app-sidebar glass collapsed">
        <nav class="sidebar-nav">
          <button class="nav-item active" data-view="dashboard" title="Home">
            <i data-lucide="layout-dashboard"></i> <span>Home</span>
          </button>
          <button class="nav-item" data-view="exams" title="Exams">
            <i data-lucide="book-open-check"></i> <span>Exams</span>
          </button>
          <button class="nav-item" data-view="practice" title="Practice">
            <i data-lucide="target"></i> <span>Practice</span>
          </button>
          <button class="nav-item" data-view="analytics" title="Elite Insights">
            <i data-lucide="bar-chart-2"></i> <span>Insights</span>
          </button>
          <div class="nav-divider"></div>
          <button id="sidebar-admin-btn" class="nav-item" data-view="admin" style="display: none; color: var(--accent-primary);" title="Admin Panel">
            <i data-lucide="shield-alert"></i> <span>Admin Panel</span>
          </button>
          <button id="sidebar-more-btn" class="nav-item" data-view="more" title="More Options">
            <i data-lucide="more-horizontal"></i> <span>More</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <button id="logout-btn" class="nav-item logout" title="Sign Out">
            <i data-lucide="log-out"></i> <span>Sign Out</span>
          </button>
          
          <!-- Legal Disclaimer -->
          <div class="sidebar-legal mobile-hide" style="font-size: 0.6rem; color: var(--text-secondary); margin-top: auto; padding: 1.5rem 0.5rem 0.5rem; text-align: center; opacity: 0.8; line-height: 1.4;">
            CBT Elite is an independent educational platform and is not affiliated with JAMB, WAEC, or NECO.
          </div>
        </div>
      </aside>

      <!-- 📢 Phase 12: Global News Drawer Container -->
      <div id="news-drawer" class="news-drawer glass">

        <div class="drawer-header">
           <h3>\uD83D\uDCE2 Exam News & Updates</h3>
           <button id="close-news-drawer" class="close-btn">&times;</button>
        </div>
        <div id="news-drawer-content" class="drawer-body">
           <div class="loader-spinner"></div>
        </div>
      </div>

      <!-- 📱 Bottom Navigation (Mobile Only) -->
      <nav id="bottom-nav" class="bottom-nav glass">
        <button class="bottom-nav-item active" data-view="dashboard" title="Home">
          <i data-lucide="layout-dashboard"></i>
          <span>Home</span>
        </button>
        <button class="bottom-nav-item" data-view="exams" title="Exams">
          <i data-lucide="book-open-check"></i>
          <span>Exams</span>
        </button>
        <button class="bottom-nav-item" data-view="practice" title="Practice">
          <i data-lucide="target"></i>
          <span>Practice</span>
        </button>
        <button class="bottom-nav-item" id="bottom-admin-btn" data-view="admin" style="display: none;" title="Admin Panel">
          <i data-lucide="shield-alert"></i>
          <span>Admin</span>
        </button>
        <button class="bottom-nav-item" id="bottom-more-btn" data-view="more" title="More Options">
          <i data-lucide="grid-2x2"></i>
          <span>More</span>
        </button>
      </nav>

      <!-- 🖼️ Phase 10: Main Content Container -->
      <main id="main-view" class="main-content-area container">
        <div id="global-loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; gap: 1rem;">
          <div class="loader-spinner" style="width: 40px; height: 40px; border-width: 4px;"></div>
          <p style="color: var(--text-secondary); font-family: 'Outfit'; font-weight: 500;">Initializing platform...</p>
        </div>
        <div id="auth-container" style="display: none;"></div>
        <div id="dashboard-container" style="display: none;"></div>
        <div id="exam-container" style="display: none; width: 100vw; margin: 0; padding: 0;"></div>
        <div id="admin-container" style="display: none;"></div>
        <div id="settings-container" style="display: none;"></div>
        <div id="analytics-container" style="display: none;"></div>
        <div id="news-article-container" style="display: none;"></div>
      </main>

      <!-- More Options Drawer (Bottom sheet on mobile / Fly-out on desktop) -->
      <div id="more-drawer" class="more-drawer">
        <div class="drawer-header">
           <h3><i data-lucide="grid-2x2"></i> More</h3>
           <button id="close-more-drawer" class="close-btn">&times;</button>
        </div>
        <div class="drawer-body">
           <div class="more-menu-list">
              <button class="more-menu-item" data-view="profile">
                <i data-lucide="user-circle"></i>
                <span>My Profile</span>
              </button>
              <button class="more-menu-item" data-view="analytics">
                <i data-lucide="bar-chart-2"></i>
                <span>Elite Insights</span>
              </button>
              <button class="more-menu-item" data-view="settings">
                <i data-lucide="settings"></i>
                <span>App Settings</span>
              </button>
              <button class="more-menu-item" id="more-news-btn">
                <i data-lucide="bell"></i>
                <span>News &amp; Updates</span>
              </button>
              <button class="more-menu-item" id="more-help-btn">
                <i data-lucide="help-circle"></i>
                <span>Help &amp; Guide</span>
              </button>
              <button class="more-menu-item" id="more-contact-btn">
                <i data-lucide="mail"></i>
                <span>Contact Us</span>
              </button>
              <button class="more-menu-item" id="more-about-btn">
                <i data-lucide="info"></i>
                <span>About CBT Elite</span>
              </button>
              <div class="menu-divider"></div>
              <button class="more-menu-item logout" id="more-logout-btn">
                <i data-lucide="log-out"></i>
                <span>Sign Out</span>
              </button>
           </div>
        </div>
      </div>
      
      <div id="sidebar-overlay" class="sidebar-overlay"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
