<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.paystack.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://*.googleusercontent.com https://*.gstatic.com; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://*.paystack.co https://generativelanguage.googleapis.com https://api.paystack.co wss://*.supabase.co; worker-src 'self' blob:;">
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
  <link rel="apple-touch-icon" href="/pwa-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBT Practice - Elite Learning Platform</title>
  <meta name="description"
    content="The ultimate CBT practice platform for JAMB, WAEC, and NECO. Thousands of AI-generated questions, instant results, and detailed performance analytics." />
  <meta name="theme-color" content="#0F172A">
  <!-- Paystack loaded lazily on demand via Dashboard.js -->
  <!-- Celebration effects handled via modular imports in main.js -->
</head>

<body>
  <div id="app" class="elite-layout">
    <!-- 🛒 Phase 12: Consolidated Branding & System Top Bar -->
    <header id="app-header" class="glass branding-header">
      <div class="header-content container-fluid" style="position: relative;">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button id="sidebar-toggle" class="header-icon-btn" title="Toggle Sidebar">
            <i data-lucide="menu"></i>
          </button>
          <div class="branding-logo" style="display: flex; align-items: center; gap: 0.5rem;">
            <img src="/brand-icon.png" alt="CBT Elite" style="width: 2.2rem; height: 2.2rem; object-fit: contain;">
            <div class="logo-text">
              <span class="cbt">CBT</span>
              <span class="elite">ELITE</span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <div class="header-stat glass" id="header-streak" title="Daily Streak" style="margin-right: 0.25rem;">
            <i data-lucide="flame" style="color: #f97316;"></i>
            <span id="streak-text">0</span>
          </div>
          
          <button id="header-notification-btn" class="header-icon-btn" title="Notifications" style="position: relative;">
            <i data-lucide="bell"></i>
            <span id="notification-badge" class="badge" style="position: absolute; top: 0px; right: 0px; background: var(--danger); color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; display: none; align-items: center; justify-content: center; min-width: 14px; height: 14px;"></span>
          </button>

          <button id="header-help-btn" class="header-icon-btn" title="Help Center">
            <i data-lucide="help-circle"></i>
          </button>

          <button id="global-theme-toggle" class="header-icon-btn" title="Toggle Theme">
            <i data-lucide="sun"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- 🧭 Phase 12: Premium Sidebar Navigation (Desktop) -->
    <aside id="app-sidebar" class="app-sidebar glass">
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard" data-tab="home">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="exams">
          <i data-lucide="file-text"></i>
          <span>Exams</span>
        </button>
        <button class="nav-item" data-view="practice">
          <i data-lucide="book-open"></i>
          <span>Practice</span>
        </button>
        <button class="nav-item" data-view="dashboard" data-tab="progress">
          <i data-lucide="bar-chart-3"></i>
          <span>Analytics</span>
        </button>
        <button class="nav-item" data-view="challenge">
          <i data-lucide="swords"></i>
          <span>Challenge</span>
        </button>
        <button class="nav-item" id="sidebar-admin-btn" data-view="admin" style="display: none;">
          <i data-lucide="shield-alert"></i>
          <span>Admin</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" data-view="profile">
          <i data-lucide="user-circle"></i>
          <span>My Profile</span>
        </button>
        <button class="nav-item" data-view="settings">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </button>
        <button class="nav-item" id="global-help-btn">
          <i data-lucide="help-circle"></i>
          <span>Help Center</span>
        </button>
        <button class="nav-item logout" id="logout-btn">
          <i data-lucide="log-out"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- 📱 Phase 12: Bottom Navigation (Mobile) -->
    <nav id="bottom-nav" class="bottom-nav glass">
      <button class="bottom-nav-item active" data-view="dashboard" data-tab="home" title="Home">
        <i data-lucide="home"></i>
        <span>Home</span>
      </button>
      <button class="bottom-nav-item" data-view="dashboard" data-tab="progress" title="Progress">
        <i data-lucide="bar-chart-2"></i>
        <span>Progress</span>
      </button>
      <button class="bottom-nav-item" data-view="dashboard" data-tab="compete" title="Compete">
        <i data-lucide="users"></i>
        <span>Compete</span>
      </button>
      <button class="bottom-nav-item" id="bottom-admin-btn" data-view="admin" style="display: none;"
        title="Admin Panel">
        <i data-lucide="shield-check"></i>
        <span>Admin</span>
      </button>
      <button class="bottom-nav-item" id="bottom-more-btn" data-view="more" title="More Options">
        <i data-lucide="grid-2x2"></i>
        <span>More</span>
      </button>
    </nav>

    <!-- 🏗️ Phase 12: Unified Main Content Area -->
    <main id="main-view" class="main-content-area">
      <div id="global-loader" class="global-loader">
        <div class="loader-spinner" style="width: 40px; height: 40px; border-width: 4px;"></div>
        <p style="color: var(--text-secondary); font-family: 'Outfit'; font-weight: 500;">Initializing platform...</p>
      </div>

      <div id="dashboard-container" style="display: none;"></div>
      <div id="admin-container" style="display: none;"></div>
      <div id="settings-container" style="display: none;"></div>
      <div id="news-article-container" style="display: none;"></div>
      <div id="practice-container" style="display: none;"></div>
      <div id="exams-container" style="display: none;"></div>
      <div id="analytics-container" style="display: none;"></div>
      <div id="profile-container" style="display: none;"></div>
      <div id="challenge-container" style="display: none;"></div>
    </main>

    </main>
  </div>

  <!-- 🚀 Exam & Fixed Layouts (Outside #app to prevent flex-squeeze) -->
  <div id="exam-container" style="display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 10000; margin: 0; padding: 0; background: var(--bg-color);"></div>

  <div id="elite-modals-container" style="position: fixed; z-index: 11000;">
    <!-- Weekly Recap, Onboarding, and Special Alerts render here -->
  </div>

  <!-- 📢 System Drawers (News & Alerts) - MOVED OUTSIDE FOR FLEX ISOLATION -->
  <div id="news-drawer" class="news-drawer glass card">
    <div class="drawer-header">
      <h3>Exam News & Updates</h3>
      <button id="close-news-drawer" class="header-icon-btn"><i data-lucide="x"></i></button>
    </div>
    <div id="news-drawer-content" class="drawer-content">
      <!-- News items render here via DataService -->
    </div>
  </div>

  <div id="more-drawer" class="news-drawer more-drawer glass card">
    <div class="drawer-header">
      <h3 style="font-family: 'Outfit'; font-weight: 900;">Elite Menu</h3>
      <button id="close-more-drawer" class="header-icon-btn"><i data-lucide="x"></i></button>
    </div>
    <div class="drawer-content">
      <button class="more-menu-item" data-view="profile">
        <i data-lucide="user-circle"></i>
        <span>My Profile</span>
      </button>
      <button class="more-menu-item" data-view="settings">
        <i data-lucide="settings"></i>
        <span>Settings</span>
      </button>
      <div class="menu-divider"></div>
      <button class="more-menu-item" id="more-news-btn">
        <i data-lucide="megaphone"></i>
        <span>Exam News</span>
      </button>
      <button class="more-menu-item" id="more-help-btn">
        <i data-lucide="help-circle"></i>
        <span>Help Guide</span>
      </button>
      <div class="menu-divider"></div>
      <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
        <button class="more-menu-item" id="more-about-btn">
          <i data-lucide="info"></i>
          <span>About Us</span>
        </button>
        <button class="more-menu-item" id="more-contact-btn">
          <i data-lucide="mail"></i>
          <span>Contact Support</span>
        </button>
        <div class="menu-divider"></div>
        <button class="more-menu-item logout" id="more-logout-btn">
          <i data-lucide="log-out"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </div>

  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div id="auth-container" style="display: none;"></div>
  <script type="module" src="/main.js?v=14"></script>
</body>

</html>
