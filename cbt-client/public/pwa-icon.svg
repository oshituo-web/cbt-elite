<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Safe-zone background for maskable icon -->
  <rect width="512" height="512" rx="0" fill="#0F172A"/>

  <!-- Graduation Cap - Scaled down to ~65% of canvas so text below is visible -->
  <!-- Top diamond/flat face of cap -->
  <path d="M256 60L460 168L256 276L52 168L256 60Z" fill="#7dd3fc"/>

  <!-- Cap body / under-brim -->
  <path d="M136 200V305C136 305 185 355 256 355C327 355 376 305 376 305V200" fill="#38bdf8" stroke="#0ea5e9" stroke-width="4" stroke-linejoin="round"/>

  <!-- Highlight on top face -->
  <path d="M256 60L440 160L256 258L72 160L256 60Z" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Tassel rope -->
  <path d="M452 168V280" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
  <!-- Tassel end block -->
  <rect x="440" y="280" width="24" height="36" rx="4" fill="#0ea5e9"/>

  <!-- CBT ELITE label at bottom - larger gap from cap so it's clearly visible -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="60" fill="#7dd3fc" letter-spacing="2">CBT ELITE</text>
</svg>
